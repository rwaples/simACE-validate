# simACE-validate: checks what simACE simulates against code it does not
# share (an R liability oracle, msprime gene-drop, ped-sim, SLiM), and
# hosts simACE's former tskit/tstrait gene-drop pipeline (tskit_pipeline/).
#
# simACE is pinned to the v0.3.0 family tag. To check a local checkout
# instead (do NOT commit):
#   simace = { path = "../..", editable = true }
# then `pixi install`. results/results.md records the simace version and
# git ref the run used.
[workspace]
name = "simACE-validate"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82,<0.83"

[dependencies]
python = "3.14.*"
ruff = "0.17.*"
# simace's own dependencies, from conda-forge so pip never builds them
# (numba 0.67 caps numpy <2.6, as in simACE's pixi.toml)
numpy = "2.5.*"
scipy = "1.18.*"
polars = "1.44.*"
pyarrow = "25.0.*"
pyyaml = "6.0.*"
numba = "0.67.*"
# oracles
r-base = "4.5.*"
r-jsonlite = "*"
r-arrow = "*"
r-kinship2 = "*"
r-matrix = "*"  # nadiv (tools/build_nadiv.sh) depends on it
# gene-drop
msprime = "1.4.*"
tskit = "1.0.*"
# tskit_pipeline/ (simACE's former scripts/gene_drop) and its tests
tstrait = "0.2.*"
pandas = "3.0.*"
pytest = "9.1.*"
# ped-sim and nadiv (built from source by tools/build_*.sh) and SLiM
cxx-compiler = "*"
make = "*"
gsl = "*"
zlib = "*"
git = "*"
slim = "5.2.*"

[pypi-dependencies]
simace = { git = "https://github.com/rwaples/simACE.git", tag = "v0.3.0" }

# xftsim (rwaples/simACE-validate#4): an independent forward simulator, used
# for assortative mating (G2b). It needs Python 3.9, numba 0.56.4 and
# numpy < 1.24, which conflict with simace's env, so it gets its own
# environment without the default feature. GPLv3: installed and called,
# never vendored. Pinned to commit 8a4cdf0 (v0.3.1).
[feature.xftsim.dependencies]
python = "3.9.*"
numba = "==0.56.4"
numpy = "1.23.*"
scipy = "1.13.*"
networkx = "3.2.*"
xarray = "*"
pandas = "2.*"
ruff = "0.17.*"

[feature.xftsim.pypi-dependencies]
xftsim = { git = "https://github.com/rborder/xftsim.git", rev = "8a4cdf07848b9a78d24f6d0f746d7231d2bdd7c2" }

[feature.xftsim.tasks]
xft-reference = { cmd = "python -m am.reference", description = "Build layer 5's committed xftsim reference samples (ADR 0003); skips current ones" }

[environments]
xftsim = { features = ["xftsim"], no-default-feature = true }

[tasks]
build-nadiv = { cmd = "bash tools/build_nadiv.sh", description = "Install the pinned nadiv CRAN version into .rlib/" }
build-pedsim = { cmd = "bash tools/build_pedsim.sh", description = "Build the pinned ped-sim tag into .pedsim/" }
harness = { cmd = "python run_harness.py", depends-on = ["build-nadiv", "build-pedsim"], description = "Run every case and write results/" }
power = { cmd = "python power.py", depends-on = ["build-nadiv"], description = "Rejection rates at stated oracle errors; writes results/power.md" }
simace-ts = { cmd = "python simace_ts/run_seed.py", description = "Run one simACE-ts seed end to end (ADR 0002); see simace_ts/run_seed.py" }
test-pipeline = { cmd = "pytest tskit_pipeline/tests simace_ts/tests -q", description = "Tests of the tskit/tstrait gene-drop pipeline and the simACE-ts runner" }
am-pilot = { cmd = "bash am/pilot.sh .work/am_pilot 6 && python -m am.summarize .work/am_pilot", description = "simACE vs xftsim AM pilot, pilot seeds only (issue #4, ADR 0003); needs `pixi install -e xftsim`" }
lint = { cmd = "ruff check && ruff format --check", description = "Lint and format check" }
