# Cases for run_harness.py.
#
# A case simulates R pedigrees with `simace simulate` (seeds seed0 ..
# seed0+R-1, flags from `simulate`), hands them to an oracle, and calibrates
# every statistic the oracle returns over the R seeds (calibration.py).
#
# Case keys:
#   id        unique name
#   layer     1 (liability oracle), 2 (gene-drop), 3 (structure), 4 (simACE-ts), 5 (assortative mating against xftsim)
#   oracle    the oracle script (oracles/<name>.R), or a Python runner in run_harness.py
#   simulate  `simace simulate` flags, without --seed and --output-pedigree
#   seed0, R  simACE seeds
#   M         oracle (or null) draws per pedigree; M+1 divisible by 10 keeps chi-square bins equal
#   law       oracle segregation law: constant (simACE's d = 1/2) | infinitesimal
#   c_law     oracle C-transmission residual: realised (default; simACE ADR 0025) | analytic
#   expect    pass (default) | info (not scored; with id_diff, a known gap in differences.md)
#   mutation  power study only: a deliberate oracle error (power.py MUTATIONS, by oracle)
#   xftsim    layer 5: the matched xftsim spec (N, M, G, r, traits, seed0, R); its reference
#             sample is am/reference/<id>.jsonl, made by `pixi run -e xftsim xft-reference`
#   references  layer 5 finite-M sentinel: labelled xftsim specs compared with each other

cases:
  - id: rm_base
    layer: 1
    oracle: liability
    note: random mating, no C transmission; both traits correlated in A, C and E
    simulate: &rm_base
      N: 2000
      G-ped: 4
      G-sim: 4
      mating-model: standard
      mating-lambda: 0.5
      p-mztwin: 0.02
      A1: 0.5
      C1: 0.2
      E1: 0.3
      A2: 0.4
      C2: 0.1
      E2: 0.5
      rA: 0.5
      rC: 0.3
      rE: 0.1
    seed0: 1000
    R: 50
    M: 199
    law: constant

  - id: deep_constant
    layer: 1
    oracle: liability
    note: small N, deep pedigree (inbred parents), scored against simACE's own law d = 1/2
    simulate: &deep
      <<: *rm_base
      N: 100
      G-ped: 12
      G-sim: 12
    seed0: 2000
    R: 50
    M: 199
    law: constant

  - id: deep_infinitesimal
    layer: 1
    oracle: liability
    note: the same pedigrees against the infinitesimal law d = 1/2 - (F_m + F_f)/4; the gap is D1
    simulate: *deep
    seed0: 2000
    R: 50
    M: 199
    law: infinitesimal
    expect: info
    id_diff: D1

  - id: ctm_base
    layer: 1
    oracle: liability
    note: rm_base with vertical C transmission (ADR 0025), coefficients differing by trait and parent
    simulate: &ctm
      <<: *rm_base
      Ctm-maternal1: 0.5
      Ctm-paternal1: 0.3
      Ctm-maternal2: 0.3
      Ctm-paternal2: 0.5
    seed0: 5000
    R: 50
    M: 199
    law: constant
    c_law: realised

  - id: ctm_analytic
    layer: 1
    oracle: liability
    note: the same pedigrees against the analytic residual U = Sigma - Bm Sigma Bm - Bf Sigma Bf; the gap is D2
    simulate: *ctm
    seed0: 5000
    R: 50
    M: 199
    law: constant
    c_law: analytic
    expect: info
    id_diff: D2

  - id: genedrop_base
    layer: 2
    oracle: genedrop
    note: msprime fixed-pedigree drop of 22 chromosomes through each pedigree; IBD against kinship2, innovations of A1
    simulate:
      <<: *rm_base
      N: 1000
    genome:
      chromosomes: 22
      morgans: 1.5
      causal_per_chromosome: 50
    seed0: 3000
    R: 30

  - id: pedsim_ibd
    layer: 2
    oracle: pedsim
    note: engine check, not simACE - msprime against ped-sim IBD fractions over 2000 copies each of FS, HS and 1C
    genome:
      chromosomes: 22
      morgans: 1.5
    copies: 2000

  - id: wf_structure
    layer: 3
    oracle: slim_wf
    note: simACE wright_fisher against a SLiM nonWF Wright-Fisher with Bernoulli sex; one statistic per pedigree
    simulate:
      <<: *rm_base
      N: 500
      G-ped: 5
      G-sim: 5
      mating-model: wright_fisher
    seed0: 4000
    R: 100

  - id: std_mating
    layer: 3
    oracle: mating_law
    note: simACE standard mating against each documented rule's own exact or Monte Carlo null (structure/mating.py)
    simulate: *rm_base
    seed0: 5000
    R: 100
    M: 199

  - id: std_structure
    layer: 3
    oracle: slim_standard
    note: simACE standard against slim/standard.slim, a second implementation of simACE's documented rules, not an outside model
    simulate:
      <<: *rm_base
      N: 500
      G-ped: 5
      G-sim: 5
    seed0: 6000
    R: 100

  # Layer 4 (ADR 0002). Seeds run on GenomeDK with `pixi run simace-ts` and
  # are scored from the Parts committed under simace_ts/parts/<id>/; the
  # harness never simulates them. Keys beyond the usual: cohort (`simace
  # cohort` flags; analyze takes censor-age from here, as simace run does),
  # architectures (tstrait_assign_effects.py flags; the first is scored, the
  # rest are the INFO sweep), data (pins the Parts must carry), pilot_seed0
  # and pilot_R (never scored).
  - id: simace_ts_p2
    layer: 4
    oracle: simace_ts
    note: SimHumanity p2 gene-drop A through simACE's pedigree; simACE cohort/analyze scored against the realised truth
    simulate:
      N: 35951            # the full p2 panel: founders must equal its eligible individuals
      G-ped: 10
      G-sim: 10
      mating-model: standard
      mating-lambda: 0.5
      p-mztwin: 0         # the pipeline refuses twins (ADR 0002 item 6)
      A1: 0.4
      C1: 0.1
      E1: 0.5
      A2: 0.4
      C2: 0.1
      E2: 0.5
      rA: 0
      rC: 0
      rE: 0
    cohort:
      G-pheno: 3
      phenotype-model1: frailty
      phenotype-params1: "{distribution: weibull, scale: 2160, rho: 0.8}"
      beta1: 1.0
      beta-sex1: 0.0
      phenotype-model2: frailty
      phenotype-params2: "{distribution: weibull, scale: 2160, rho: 0.8}"
      beta2: 1.0
      beta-sex2: 0.0
      N-sample: 0         # pass-through ascertainment (ADR 0002 item 6)
      censor-age: 80
    architectures:
      - {name: c1k_a05, num-causal: 1000, alpha: -0.5, maf-threshold: 0.01, effect-mean: 0.0, effect-var: 1.0}
      - {name: c100_a05, num-causal: 100, alpha: -0.5, maf-threshold: 0.01, effect-mean: 0.0, effect-var: 1.0}
      - {name: c10k_a05, num-causal: 10000, alpha: -0.5, maf-threshold: 0.01, effect-mean: 0.0, effect-var: 1.0}
      - {name: c100k_a05, num-causal: 100000, alpha: -0.5, maf-threshold: 0.01, effect-mean: 0.0, effect-var: 1.0}
      - {name: c1m_a05, num-causal: 1000000, alpha: -0.5, maf-threshold: 0.01, effect-mean: 0.0, effect-var: 1.0}
      - {name: c1k_a0, num-causal: 1000, alpha: 0.0, maf-threshold: 0.01, effect-mean: 0.0, effect-var: 1.0}
    data:
      trees_zip_sha256: 003fa571a76ea646d50f21cfc3be383922a78aa661baafc5d86cdd00f42193e8
      simhumanity_commit: aa2242e9c9128e5612e5309ad0a75bb799c3d030
      preprocessed_fingerprint: ddea736699a31c66ade5a140051c3385
    seed0: 9000
    R: 50                 # fixed 2026-11-05 from the pilot (ADR 0002 item 10), before any scored seed ran
    pilot_seed0: 990000
    pilot_R: 3

  # Layer 5 (ADR 0003): simACE's population moments under assortative mating against
  # independent xftsim runs at a matched configuration, by a Welch t per row. Both traits
  # A 0.5, C 0, E 0.5, independent (simACE's CLI defaults rA 0.5 and rC 0.3 are overridden);
  # no twins. Every case has its own simACE and xftsim seed ranges (ADR 0003, decision 6).
  - id: am_r0
    layer: 5
    oracle: xftsim
    note: random mating (check 3 of simACE-validate#4), through xftsim's assortative regime at r = 0
    simulate: &am
      N: 10000
      G-ped: 6
      G-sim: 6
      mating-model: standard
      mating-lambda: 0.5
      p-mztwin: 0
      A1: 0.5
      C1: 0
      E1: 0.5
      A2: 0.5
      C2: 0
      E2: 0.5
      rA: 0
      rC: 0
      rE: 0
      assort1: 0
    seed0: 7000
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0, traits: 1, seed0: 17000, R: 100}

  - id: am_r05
    layer: 5
    oracle: xftsim
    note: single-trait assortment on trait 1 at mate correlation 0.5
    simulate:
      <<: *am
      assort1: 0.5
    seed0: 7200
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0.5, traits: 1, seed0: 17200, R: 100}

  - id: am_r08
    layer: 5
    oracle: xftsim
    note: single-trait assortment at 0.8; v0.2.0's realised mate correlation fell short (simACE #74), v0.3.0 pins it (ADR 0032)
    simulate:
      <<: *am
      assort1: 0.8
    seed0: 7400
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0.8, traits: 1, seed0: 17400, R: 100}

  - id: am2_r02
    layer: 5
    oracle: xftsim
    note: two-trait assortment, every mate correlation (both traits, both cross terms) 0.2
    simulate:
      <<: *am
      assort1: 0.2
      assort2: 0.2
      assort-matrix: "[[0.2, 0.2], [0.2, 0.2]]"
    seed0: 7600
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0.2, traits: 2, seed0: 17600, R: 100}

  - id: am2_r04
    layer: 5
    oracle: xftsim
    note: two-trait assortment, every mate correlation 0.4 (feasible below 0.5 with independent traits)
    simulate:
      <<: *am
      assort1: 0.4
      assort2: 0.4
      assort-matrix: "[[0.4, 0.4], [0.4, 0.4]]"
    seed0: 7800
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0.4, traits: 2, seed0: 17800, R: 100}

  - id: am2_r0401
    layer: 5
    oracle: xftsim
    note: two-trait assortment with unequal mate correlations, rank 1 (0.4, 0.1, cross sqrt(0.04) = 0.2; ADR 0003 decision 2)
    simulate:
      <<: *am
      assort1: 0.4
      assort2: 0.1
      assort-matrix: "[[0.4, 0.2], [0.2, 0.1]]"
    seed0: 8200
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0.4, r2: 0.1, traits: 2, seed0: 19000, R: 100}

  - id: amc_r05
    layer: 5
    oracle: xftsim
    note: single-trait assortment at 0.5 with household C 0.2 (by mother); xftsim builds C from the mother's private draw
    simulate:
      <<: *am
      C1: 0.2
      E1: 0.3
      assort1: 0.5
    seed0: 8000
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0.5, traits: 1, C: 0.2, seed0: 18800, R: 100}

  # C transmission (simACE ADR 0025; rwaples/simACE-validate#5): c = b_m c_mother + b_f c_father + a
  # household draw by mother. xftsim builds c with one LinearVerticalComponent whose household term has
  # the fixed random-mating residual C (1 - b_m^2 - b_f^2); simACE tops up from the realised covariance.
  - id: ctm_rm
    layer: 5
    oracle: xftsim
    note: C transmission b_m 0.5, b_f 0.3, C 0.2 under random mating; xftsim pairs by am/run_xft.py's half-sib regime
    simulate:
      <<: *am
      C1: 0.2
      E1: 0.3
      Ctm-maternal1: 0.5
      Ctm-paternal1: 0.3
    seed0: 8400
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0, traits: 1, C: 0.2, bm: 0.5, bf: 0.3, pairing: halfsib, seed0: 19200, R: 100}

  - id: ctm_am
    layer: 5
    oracle: xftsim
    note: ctm_rm's transmission under AM at 0.5; simACE's realised top-up against xftsim's fixed residual (check 3 of #5)
    simulate:
      <<: *am
      C1: 0.2
      E1: 0.3
      Ctm-maternal1: 0.5
      Ctm-paternal1: 0.3
      assort1: 0.5
    seed0: 8600
    R: 100
    xftsim: {N: 10000, M: 1000, G: 6, r: 0.5, traits: 1, C: 0.2, bm: 0.5, bf: 0.3, seed0: 19400, R: 100}
    expect: info
    id_diff: D5

  - id: am_finite_m
    layer: 5
    oracle: xftsim_finite_m
    note: xftsim Var(A) at M 250 against M 4000, both r; bounds the finite-locus gap (ADR 0003, decision 5)
    expect: info
    references:
      - {label: m250_r05, xftsim: {N: 10000, M: 250, G: 6, r: 0.5, seed0: 18000, R: 100}}
      - {label: m4000_r05, xftsim: {N: 10000, M: 4000, G: 6, r: 0.5, seed0: 18200, R: 100}}
      - {label: m250_r08, xftsim: {N: 10000, M: 250, G: 6, r: 0.8, seed0: 18400, R: 100}}
      - {label: m4000_r08, xftsim: {N: 10000, M: 4000, G: 6, r: 0.8, seed0: 18600, R: 100}}
